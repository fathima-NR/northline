<div class="page">
  <div class="container auth-wrap">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <span class="eyebrow">Welcome back</span>
      <h1>Sign in</h1>
      <p class="muted">Use the email and password for your Northline account.</p>
      @if (error()) { <p class="form-error">{{ error() }}</p> }
      <label class="field"><span>Email</span><input type="email" formControlName="email" autocomplete="email" /></label>
      <label class="field"><span>Password</span><input type="password" formControlName="password" autocomplete="current-password" /></label>
      <button class="btn btn-block" type="submit" [disabled]="busy()">Sign in</button>
      <p>New here? <a class="link" routerLink="/register">Create an account</a></p>
    </form>
  </div>
</div>
