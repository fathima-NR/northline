<div class="page">
  <div class="container auth-wrap">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <span class="eyebrow">Join Northline</span>
      <h1>Create account</h1>
      @if (error()) { <p class="form-error">{{ error() }}</p> }
      <label class="field"><span>Name</span><input formControlName="name" autocomplete="name" /></label>
      <label class="field"><span>Email</span><input type="email" formControlName="email" autocomplete="email" /></label>
      <label class="field"><span>Phone</span><input formControlName="phone" autocomplete="tel" /></label>
      <label class="field"><span>Password</span><input type="password" formControlName="password" autocomplete="new-password" /></label>
      <button class="btn btn-block" type="submit" [disabled]="busy()">Create account</button>
      <p>Already shopping? <a class="link" routerLink="/login">Sign in</a></p>
    </form>
  </div>
</div>
