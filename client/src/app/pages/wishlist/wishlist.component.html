<div class="page">
  <div class="container">
    <div class="page-head">
      <div>
        <h1>Wishlist</h1>
        <p>Saved for the next shop.</p>
      </div>
    </div>
    @if (!wishlist.items().length) {
      <div class="empty panel">
        <h2>No saved items</h2>
        <p>Tap the heart on a product to keep it here.</p>
        <a class="btn" routerLink="/shop">Browse products</a>
      </div>
    } @else {
      <div class="grid">
        @for (product of wishlist.items(); track product._id) {
          <app-product-card [product]="product" />
        }
      </div>
    }
  </div>
</div>
